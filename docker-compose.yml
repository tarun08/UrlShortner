services:
  urlshortner:
    container_name: url-shortner-service
    build:
      context: ./UrlShortnerService
      dockerfile: Dockerfile
    ports:
      - "17000:17000"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:17000
    depends_on:
      - mongodb

  urlredirection:
    container_name: url-redirection-service
    build:
      context: ./UrlRedirectionService
      dockerfile: Dockerfile
    ports:
      - "18000:18000"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:18000
    depends_on:
      - mongodb

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
