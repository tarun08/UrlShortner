<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="shortener-box">
            <h3>🔗 Shorten a long URL</h3>
            <input type="text" placeholder="Enter long link here" class="input" id="longUrl" />

            <h4>🛠 Customize your link</h4>
            <div class="customize-row">
                <input type="text" placeholder="Enter alias" class="input alias" id="alias" />
            </div>
            <button class="btn" id="shortenBtn">Shorten URL</button>

            <!-- Result message -->
            <p id="result" style="margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <script>
        document.getElementById('shortenBtn').addEventListener('click', async () => {
            const longUrl = document.getElementById('longUrl').value.trim();
            const alias = document.getElementById('alias').value.trim();
            const resultEl = document.getElementById('result');

            // Clear result area
            resultEl.textContent = '';

            if (!longUrl) {
                resultEl.textContent = '❌ Please enter a long URL.';
                return;
            }

            const payload = {
                longUrl: longUrl,
                customName: alias || null,
                expiryDate: 0,
                createdOn: new Date().toISOString()
            };

            try {
                const response = await fetch('/UrlShortner/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || '❌ Failed to shorten URL.');
                }

                resultEl.innerHTML = `✅ Shortened URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
            } catch (error) {
                resultEl.textContent = error.message;
            }
        });
    </script>
</body>
</html>
